services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-helpdesk}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
      - ./docker/mysql/init/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./Dump_Helpdesk_RD.sql:/docker-entrypoint-initdb.d/20-Dump_Helpdesk_RD.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: pnpm --filter @helpdesk/api dev
    restart: unless-stopped
    environment:
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      NIVEL3_DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-helpdesk}@database:3306/nivel3
      N3RD_DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-helpdesk}@database:3306/n3rd
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: pnpm --filter @helpdesk/web dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
    depends_on:
      - api

volumes:
  helpdesk_mysql_data:
