services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-helpdesk}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
      - ./docker/mysql/init/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./Dump_Helpdesk_RD.sql:/docker-entrypoint-initdb.d/20-Dump_Helpdesk_RD.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  helpdesk_mysql_data:
