name: helpdesk

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-helpdesk}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    image: node:22-bookworm-slim
    init: true
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NIVEL3_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-helpdesk}@mysql:3306/nivel3
      MKT_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-helpdesk}@mysql:3306/mkt
      N3RD_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-helpdesk}@mysql:3306/n3rd
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - .:/workspace
      - helpdesk_node_modules:/workspace/node_modules
      - helpdesk_pnpm_store:/pnpm/store
    command: >-
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.24.0 --activate &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install &&
      pnpm dev"

volumes:
  helpdesk_mysql_data:
  helpdesk_node_modules:
  helpdesk_pnpm_store:
